<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#000000" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Recursive Neon" />
  <meta name="mobile-web-app-capable" content="yes" />
  <title>Recursive Neon</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <canvas id="canvas" aria-label="Generative recursive artwork"></canvas>

  <div id="hud" class="hud" aria-live="polite">
    <div id="hudAngle">28.323</div>
    <div id="hudScale">0.707</div>
  </div>

  <button id="reveal" class="reveal" aria-label="Show controls" title="Show controls">☰</button>

  <aside id="controls" class="controls" aria-label="Artwork controls">
    <div class="grabber" aria-hidden="true"></div>
    <header class="controls__header">
      <div>
        <div class="eyebrow">RECURSIVE NEON</div>
        <h1>Generator</h1>
      </div>
      <button id="collapse" class="iconButton" aria-label="Hide controls" title="Hide controls">×</button>
    </header>

    <label class="field">
      <span>Mode</span>
      <select id="mode">
        <option value="tree">Recursive tree</option>
        <option value="hex">Hex recursion</option>
        <option value="weave">Infinite weave</option>
      </select>
    </label>

    <label class="field">
      <span>Angle <output id="angleOut">28.3°</output></span>
      <input id="angle" type="range" min="4" max="88" step="0.1" value="28.3" />
    </label>

    <label class="field">
      <span>Scale <output id="scaleOut">0.707</output></span>
      <input id="scale" type="range" min="0.45" max="0.82" step="0.001" value="0.707" />
    </label>

    <label class="field">
      <span>Depth <output id="depthOut">9</output></span>
      <input id="depth" type="range" min="3" max="12" step="1" value="9" />
    </label>

    <label class="field">
      <span>Line glow <output id="glowOut">16</output></span>
      <input id="glow" type="range" min="0" max="36" step="1" value="16" />
    </label>

    <label class="field">
      <span>Hue drift <output id="hueOut">105°</output></span>
      <input id="hue" type="range" min="0" max="240" step="1" value="105" />
    </label>

    <div class="buttonRow">
      <button id="randomize" class="action">Randomize</button>
      <button id="animate" class="action action--primary" aria-pressed="true">Pause</button>
    </div>

    <p class="hint">Controls hide automatically. Tap anywhere or press <kbd>C</kbd> to bring them back.</p>
  </aside>

  <script src="app.js"></script>
</body>
</html>
